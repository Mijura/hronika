AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  project-versioning

Transform:
  - AWS::Serverless-2016-10-31

Resources:
  InitializeProjectHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/initialize-project-history.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Initialize a project history
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: "{{resolve:secretsmanager:vars:SecretString:VersionControlBucket}}"
          PROJECT_HISTORY_TABLE: !Ref ProjectHistoryTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/initialize-project-history.ts

  SaveVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/save-version.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Save project version
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: "{{resolve:secretsmanager:vars:SecretString:VersionControlBucket}}"
          PROJECT_HISTORY_TABLE: !Ref ProjectHistoryTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/save-version.ts

  GetLatestVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-latest-version.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Fetch latest project version
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: "{{resolve:secretsmanager:vars:SecretString:VersionControlBucket}}"
          PROJECT_HISTORY_TABLE: !Ref ProjectHistoryTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-latest-version.ts

  ProjectHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProjectHistory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  InitializeProjectHistoryFunctionArn:
    Description: ARN of InitializeProjectHistoryFunction (for platform-serverless-api integration)
    Value: !GetAtt InitializeProjectHistoryFunction.Arn
    Export:
      Name: ProjectVersioning-InitializeProjectHistoryFunctionArn

  SaveVersionFunctionArn:
    Description: ARN of SaveVersionFunction (for platform-serverless-api integration)
    Value: !GetAtt SaveVersionFunction.Arn
    Export:
      Name: ProjectVersioning-SaveVersionFunctionArn

  GetLatestVersionFunctionArn:
    Description: ARN of GetLatestVersionFunction (for platform-serverless-api integration)
    Value: !GetAtt GetLatestVersionFunction.Arn
    Export:
      Name: ProjectVersioning-GetLatestVersionFunctionArn

  ProjectHistoryTableName:
    Description: DynamoDB table name
    Value: !Ref ProjectHistoryTable
    Export:
      Name: ProjectVersioning-ProjectHistoryTableName
