AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  version-control-system

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  CommitVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/controllers/commit-version/commit-version.commitVersionHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Create and save a version of a files
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: "{{resolve:secretsmanager:vars:SecretString:VersionControlBucket}}"
          VERSION_TABLE: !Ref VersionTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /commit-version/
            Method: POST
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/controllers/commit-version/commit-version.ts

  PullArtifactsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/controllers/pull-artifacts/pull-artifacts.pullArtifactsHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Pull artifacts from a version
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: "{{resolve:secretsmanager:vars:SecretString:VersionControlBucket}}"
          VERSION_TABLE: !Ref VersionTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /pull-artifacts/
            Method: GET

  VersionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Version
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: projectGSI
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          Projection:
            ProjectionType: ALL

Outputs:
  VersionControlSystemApi:
    Description: "API Gateway URL for version control system"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: VersionControlSystemApi 
