AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  version-control-system

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  SaveVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/controllers/save-version/save-version.saveVersionHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Create and save a version of a files
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: "{{resolve:secretsmanager:vars:SecretString:VersionControlBucket}}"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /save-version/
            Method: POST
    Metadata: #Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/controllers/save-version/save-version.ts

Outputs:
  VersionControlSystemApi:
    Description: "API Gateway URL for version control system"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: VersionControlSystemApi 
