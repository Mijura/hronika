AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  project-versioning

Transform:
  - AWS::Serverless-2016-10-31

Resources:
  VersionControlBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-VersionControl"

  InitializeProjectHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/initialize-project-history.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Initialize a project history
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectHistoryTable
        - S3CrudPolicy:
            BucketName: !Ref VersionControlBucket
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: !Ref VersionControlBucket
          PROJECT_HISTORY_TABLE: !Ref ProjectHistoryTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/initialize-project-history.ts

  SaveVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/save-version.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Save project version
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectHistoryTable
        - S3CrudPolicy:
            BucketName: !Ref VersionControlBucket
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: !Ref VersionControlBucket
          PROJECT_HISTORY_TABLE: !Ref ProjectHistoryTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/save-version.ts

  GetLatestVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-latest-version.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Fetch latest project version
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectHistoryTable
        - S3CrudPolicy:
            BucketName: !Ref VersionControlBucket
      Environment:
        Variables:
          VERSION_CONTROL_BUCKET: !Ref VersionControlBucket
          PROJECT_HISTORY_TABLE: !Ref ProjectHistoryTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-latest-version.ts

  ProjectHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-ProjectHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  InitializeProjectHistoryFunctionArn:
    Description: ARN of InitializeProjectHistoryFunction (for platform-serverless-api integration)
    Value: !GetAtt InitializeProjectHistoryFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-InitializeProjectHistoryFunctionArn"

  SaveVersionFunctionArn:
    Description: ARN of SaveVersionFunction (for platform-serverless-api integration)
    Value: !GetAtt SaveVersionFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SaveVersionFunctionArn"

  GetLatestVersionFunctionArn:
    Description: ARN of GetLatestVersionFunction (for platform-serverless-api integration)
    Value: !GetAtt GetLatestVersionFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetLatestVersionFunctionArn"

  ProjectHistoryTableName:
    Description: DynamoDB table name
    Value: !Ref ProjectHistoryTable
    Export:
      Name: !Sub "${AWS::StackName}-ProjectHistoryTableName"

  VersionControlBucketName:
    Description: S3 bucket for version control storage
    Value: !Ref VersionControlBucket
    Export:
      Name: !Sub "${AWS::StackName}-VersionControlBucketName"
